# Chaque jour : génère un lot de nouvelles données, lance dbt build, puis commit le lot.
name: Lot quotidien

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 06:00 UTC
  workflow_dispatch:
    inputs:
      date:
        description: "Date du lot (AAAA-MM-JJ). Vide = aujourd'hui."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  daily-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Générer le lot du jour
        env:
          BATCH_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$BATCH_DATE" ]; then
            python scripts/generate_daily_batch.py --date "$BATCH_DATE"
          else
            python scripts/generate_daily_batch.py
          fi

      - name: dbt deps
        working-directory: rebtel_dbt
        run: dbt deps --profiles-dir .

      - name: dbt build (modèles + tests)
        working-directory: rebtel_dbt
        run: dbt build --profiles-dir .

      - name: Commit du lot
        run: |
          git add storage/raw/batches
          if git diff --cached --quiet; then
            echo "Aucun nouveau lot à commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lot quotidien $(ls storage/raw/batches | sort | tail -1)"
          git push
